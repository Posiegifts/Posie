name: Update sitemap and gift pages

on:
  push:
    branches: [main]
    paths:
      - "content.js"
      - "*.html"
      - "scripts/**"
      - ".github/workflows/update-sitemap.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build gift pages
        run: node scripts/make-gift-pages.js

      - name: Build sitemap.xml
        run: node scripts/make-sitemap.js

      - name: Commit changes if anything changed
        run: |
          git add -A -- sitemap.xml gifts
          if git diff --cached --quiet; then
            echo "Sitemap and gift pages are already up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update sitemap.xml and gift pages automatically"
            git push
            gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
          fi
        env:
          GH_TOKEN: ${{ github.token }}
