name: Update sitemap

on:
  push:
    branches: [main]
    paths:
      - "content.js"
      - "*.html"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sitemap.xml
        run: node scripts/make-sitemap.js

      - name: Commit sitemap if it changed
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo "Sitemap is already up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sitemap.xml
            git commit -m "Update sitemap.xml automatically"
            git push
            gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
          fi
        env:
          GH_TOKEN: ${{ github.token }}
